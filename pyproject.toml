[project]
name = "cnmf-usage"
version = "0.1.0"
description = "Back-calculate cNMF program usage from fixed reference spectra and AnnData counts"
readme = "README.md"
license = "MIT AND CC-BY-4.0"
license-files = [
    "LICENSE",
    "src/cnmf_usage/data/references/LICENSE",
]
keywords = [
    "cnmf",
    "single-cell",
    "bioinformatics",
    "transcriptomics",
    "glioma",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "anndata==0.10.9",
    "h5py==3.13.0",
    "numpy==1.24.4",
    "pandas==2.0.3",
    "scanpy==1.11.5",
    "scikit-learn==1.6.0",
    "scipy==1.11.4",
]

[project.scripts]
cnmf-usage = "cnmf_usage.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
