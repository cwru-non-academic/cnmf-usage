name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --group dev

      - name: Ruff
        run: |
          uvx ruff check src tests
          uvx ruff format --check src tests

      - name: Tests
        run: uv run pytest -q tests/

      - name: Build wheel
        run: uv build --wheel

      - name: Install wheel in clean environment
        run: |
          uv venv --python 3.11 /tmp/cnmf-wheel-test
          uv pip install --python /tmp/cnmf-wheel-test/bin/python dist/*.whl

      - name: Test installed package
        run: |
          /tmp/cnmf-wheel-test/bin/cnmf-usage --version
          /tmp/cnmf-wheel-test/bin/python - <<'PY'
          from cnmf_usage.references import available_references, load_reference

          references = available_references()
          assert len(references) == 3

          for reference_id in references:
              load_reference(reference_id)

          print("Installed wheel and bundled references: PASS")
          PY
